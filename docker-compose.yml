networks:
  internal:
    internal: true
  external:
    driver: bridge


services:
 
  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ridebase_db
    ports:
      - "5432:5432"
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


  nginx:
    image: nginx:latest
    container_name: ridebase_nginx
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_web:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    restart: always
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD","curl","--fail","http://localhost"]
      interval: 10s
      retries: 5
      start_period: 30s

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_web:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email farai.wande@ridebase.app --agree-tos --no-eff-email -d ridebase.app -d www.ridebase.app
    networks:
      - internal
      - external

volumes:
  certbot_web:
  postgres_data: